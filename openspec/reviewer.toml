[lint]
# Where tests and other citing source live, and which files to read.
# tests/ is left out: its fixtures and titles carry citations that are
# meant to dangle.
source_roots    = ["src", ".claude"]
source_globs    = ["**/*.md", "**/*.rs", "**/*.toml", "**/*.ts"]
skip_dirs       = ["node_modules", "target", "dist", "build", "_build", "deps"]

# Evidence cited from canon specs: paths, regression test names, commits.
path_prefixes   = ["src", "tests", ".claude"]
path_extensions = ["md", "rs", "toml", "ts"]
test_pattern    = "bug__\\w+"

# A call helper that builds `spec:` tags at runtime, if the repository has one.
# cite_helper   = "cite"

# Change names must start with one of these scopes and a hyphen.
# change_scopes = ["ui", "api"]
# grandfathered = ["legacy-change"]

[term_drift]
max_common = 5

# The glossary capability and how often an undefined span must recur.
# An empty capability switches the glossary checks off.
[definitions]
capability     = "definitions"
min_recurrence = 3

# Evidence the specs quote as an example rather than cite. Each entry
# names one of `citation`, `path`, `test` or `commit`, and the lint warns
# when one stops silencing anything.

[[lint.ignore_evidence]]
citation = "sitemap-index § Flat index of all routes and pages"
reason   = "a made-up capability in the scenario that shows a citation in a test title"

[[lint.ignore_evidence]]
citation = "lineage § Lineage is"
reason   = "the truncated half of a citation the wrap scenarios reassemble"

[[lint.ignore_evidence]]
citation = "alpha § Some rule"
reason   = "a made-up capability the grammar scenarios parse"

[[lint.ignore_evidence]]
citation = "alpha § Some rule that"
reason   = "the same made-up capability, cut off where a line wraps"

[[lint.ignore_evidence]]
citation = "keyring-tombstones § Admin API mints invites"
reason   = "an Opake requirement quoted to show a synonym inside a citation"

[[lint.ignore_evidence]]
citation = "x § A tenant imports the document"
reason   = "a made-up capability in the scenario for a sibling mention that is only a citation"

[[lint.ignore_evidence]]
path   = "src/a.rs"
reason = "the stand-in path in the scenario for a cited path that does not exist"

[[lint.ignore_evidence]]
test   = "bug__float_not_rounding"
reason = "the stand-in regression test in the scenario for a cited test that is gone"

[[lint.ignore_evidence]]
commit = "deadbeef"
reason = "the stand-in hash in the scenario for a cited commit that is not in the repository"
