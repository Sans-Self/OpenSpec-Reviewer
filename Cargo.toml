[package]
name = "openspec-reviewer"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Noï van Mondfrans"]
description = "Review OpenSpec changes as the semantic diff they are, not the file diff git shows"

[lib]
path = "src/lib.rs"

[[bin]]
name = "openspec-reviewer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "=4.6.0", features = ["unstable-dynamic"] }
ratatui = "0.29"
crossterm = "0.28"
similar = { version = "2", features = ["inline"] }
diffy = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
signal-hook = "0.3"
toml = "0.8"
regex = "1"
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
